<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Birthday Surprise 🎉</title>

    <style>
        body {
            margin: 0;
            font-family: Arial;
            background: linear-gradient(135deg, #ff9a9e, #fad0c4);
            text-align: center;
            color: white;
        }

        h1 {
            font-size: 40px;
            margin-top: 20px;
        }

        button {
            padding: 15px 25px;
            font-size: 18px;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            background: #ff4d6d;
            color: white;
            margin-top: 10px;
        }

        /* FULL SCREEN IMAGE */
        .gallery img {
            width: 100%;
            height: 70vh;
            object-fit: cover;
            cursor: pointer;
            transition: 0.8s ease;
            border-radius: 0;
            margin-top: 20px;
        }

        /* Poster card */
        .poster {
            display: none;
            margin-top: 20px;
        }

        .card {
            background: white;
            color: black;
            width: 70%;
            margin: auto;
            padding: 25px;
            border-radius: 20px;
            box-shadow: 0 0 20px rgba(0,0,0,0.3);
        }

        .birthday-text {
            font-size: 32px;
            color: #ff4d6d;
            font-weight: bold;
        }

        /* Hide second images initially */
        #img2, #img3 {
            display: none;
        }
    </style>
</head>

<body>

<h1>🎁 A Special Surprise Awaits</h1>
<p>Click button, then click image to change memories 🎉</p>

<button onclick="showPoster()">Click Here</button>

<!-- 🎂 Poster Section -->
<div class="poster" id="poster">

    <div class="card">

        <h2 class="birthday-text">🎉 Happy Birthday PRIYA 🎉</h2>

        <p>Wishing you happiness, love and success 💖</p>

        <!-- 🖼️ IMAGE SLIDER -->
        <div class="gallery">
            <img id="bgImage" src="image1.jpg" onclick="nextImage()">
        </div>

        <p>🎂 Click image to change memories 🎈</p>

    </div>

</div>

<!-- 🎵 MUSIC -->
<audio id="song" loop>
    <source src="birthday.mp3" type="audio/mpeg">
</audio>

<script>
let step = 1;

function showPoster() {
    document.getElementById("poster").style.display = "block";

    let audio = document.getElementById("song");
    audio.play().catch(err => console.log("Audio blocked"));
}

function nextImage() {
    let img = document.getElementById("bgImage");

    if (step === 1) {
        img.src = "image2.jpg";
        step = 2;
    }
    else if (step === 2) {
        img.src = "image3.jpg";
        step = 3;
    }
    else {
        img.src = "image1.jpg";
        step = 1;
    }
}
</script>

</body>
</html>
