<!DOCTYPE html>
<html>
<head>
    <title>DevOps Paint App</title>
    <style>
        body {
            margin: 0;
            font-family: Arial;
            background: #0f172a;
            color: white;
            text-align: center;
        }

        h1 {
            margin: 15px;
            color: #38bdf8;
        }

        .toolbar {
            padding: 10px;
            background: #1e293b;
        }

        canvas {
            border: 2px solid white;
            margin-top: 10px;
            background: white;
            cursor: crosshair;
        }

        button {
            padding: 8px 12px;
            margin: 5px;
            border: none;
            cursor: pointer;
            border-radius: 6px;
        }
    </style>
</head>
<body>

<h1>🎨 DevOps Paint App</h1>

<div class="toolbar">
    <button onclick="setColor('black')">Black</button>
    <button onclick="setColor('red')">Red</button>
    <button onclick="setColor('blue')">Blue</button>
    <button onclick="clearCanvas()">Clear</button>
</div>

<canvas id="board" width="900" height="500"></canvas>

<script>
let canvas = document.getElementById("board");
let ctx = canvas.getContext("2d");

let drawing = false;
let color = "black";

canvas.addEventListener("mousedown", () => drawing = true);
canvas.addEventListener("mouseup", () => drawing = false);
canvas.addEventListener("mouseout", () => drawing = false);

canvas.addEventListener("mousemove", function (e) {
    if (!drawing) return;

    ctx.fillStyle = color;
    ctx.beginPath();
    ctx.arc(e.offsetX, e.offsetY, 3, 0, Math.PI * 2);
    ctx.fill();
});

function setColor(c) {
    color = c;
}

function clearCanvas() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);
}
</script>

</body>
</html>
