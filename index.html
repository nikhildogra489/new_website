<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Birthday Surprise 🎉</title>

    <style>
        body {
            margin: 0;
            font-family: Arial;
            background: linear-gradient(135deg, #ff9a9e, #fad0c4);
            text-align: center;
            color: white;
        }

        .container {
            margin-top: 80px;
        }

        h1 {
            font-size: 40px;
        }

        button {
            padding: 15px 25px;
            font-size: 18px;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            background: #ff4d6d;
            color: white;
            margin-top: 20px;
        }

        .poster {
            display: none;
            margin-top: 40px;
        }

        .card {
            background: white;
            color: black;
            width: 70%;
            margin: auto;
            padding: 25px;
            border-radius: 20px;
            box-shadow: 0 0 20px rgba(0,0,0,0.3);
        }

        .birthday-text {
            font-size: 32px;
            color: #ff4d6d;
            font-weight: bold;
        }

        img {
            width: 200px;
            margin: 10px;
            border-radius: 10px;
        }
    </style>
</head>

<body>

<div class="container">

    <h1>🎁 A Special Surprise Awaits</h1>
    <p>Click below to reveal it 🎉</p>

    <button onclick="showPoster()">Click Here</button>

    <!-- 🎂 Poster -->
    <div class="poster" id="poster">

        <div class="card">

            <h2 class="birthday-text">🎉 Happy Birthday PRIYA 🎉</h2>

            <p>Wishing you happiness, love and success 💖</p>

            <!-- 🖼️ Images -->
            <div>
                <img src="./image1.jpg">
                <img src="./image2.jpg">
            </div>

            <p>🎂🎈🎊 Enjoy your special day 🎊🎈🎂</p>

        </div>

    </div>

</div>

<!-- 🎵 Music -->
<audio id="song" loop>
    <source src="birthday.mp3" type="audio/mpeg">
</audio>

<script>
function showPoster() {
    document.getElementById("poster").style.display = "block";

    let audio = document.getElementById("song");
    audio.play().catch(err => console.log("Audio blocked"));
}
</script>

</body>
</html>
