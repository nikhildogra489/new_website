<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>UNKNOWN FILE: PRIYA 🎬</title>

<style>
@import url('https://fonts.googleapis.com/css2?family=Montserrat:wght@300;600;900&display=swap');

*{
  margin:0;
  padding:0;
  box-sizing:border-box;
  font-family:Montserrat;
}

body{
  background:black;
  overflow:hidden;
  color:white;
}

/* DARK CINEMATIC BACKGROUND */
.bg{
  position:fixed;
  width:100%;
  height:100%;
  background:url("background.jpg") center/cover no-repeat;
  filter:brightness(0.12) contrast(1.4) grayscale(0.6);
  transform:scale(1.1);
  z-index:-5;
}

/* FOG */
.fog{
  position:fixed;
  width:200%;
  height:200%;
  background:radial-gradient(circle, rgba(255,255,255,0.05), transparent 60%);
  animation: drift 12s infinite linear;
  z-index:-1;
}

@keyframes drift{
  0%{transform:translate(0,0);}
  50%{transform:translate(-10%,10%);}
  100%{transform:translate(0,0);}
}

/* GLITCH TITLE */
.title{
  font-size:60px;
  color:red;
  text-shadow:0 0 20px red;
  animation: glitch 1s infinite;
}

@keyframes glitch{
  0%{transform:translate(0);}
  20%{transform:translate(-2px,2px);}
  40%{transform:translate(2px,-2px);}
  60%{transform:translate(-1px,1px);}
  100%{transform:translate(0);}
}

/* SCENES */
.scene{
  position:absolute;
  width:100%;
  height:100%;
  display:flex;
  justify-content:center;
  align-items:center;
  flex-direction:column;
  text-align:center;
  opacity:0;
  transition:2s;
  padding:20px;
}

.scene.active{
  opacity:1;
}

/* TEXT STYLE */
.scene p{
  font-size:22px;
  max-width:700px;
  opacity:0.8;
  text-shadow:0 0 10px black;
}

/* FLASH EFFECT */
.flash{
  position:fixed;
  width:100%;
  height:100%;
  background:white;
  opacity:0;
  pointer-events:none;
  z-index:999;
}

/* IMAGE SCARY STYLE */
img{
  width:220px;
  height:320px;
  object-fit:cover;
  margin-top:15px;
  border:2px solid rgba(255,0,0,0.4);
  filter:brightness(0.6) contrast(1.2);
  transition:0.4s;
}

img:hover{
  transform:scale(1.1);
  filter:brightness(1);
}

/* SOUND */
.sound-btn{
  position:fixed;
  bottom:20px;
  right:20px;
  background:red;
  padding:10px;
  border:none;
  color:white;
  cursor:pointer;
}
</style>
</head>

<body>

<div class="bg"></div>
<div class="fog"></div>
<div class="flash" id="flash"></div>

<audio id="music" src="birthday.mp3"></audio>

<!-- SCENES -->
<div class="scene active" id="s1">
  <div class="title">UNKNOWN FILE FOUND</div>
  <p>Recovered data from system: PRiYA_2004</p>
</div>

<div class="scene" id="s2">
  <div class="title">PLAYBACK STARTING...</div>
  <p>Something is wrong with this memory...</p>
</div>

<div class="scene" id="s3">
  <p>"Happy Birthday Priya..."</p>
  <img src="image1.jpg">
</div>

<div class="scene" id="s4">
  <p>More memories appear... but they feel distorted</p>
  <img src="image2.jpg">
</div>

<div class="scene" id="s5">
  <p>Final fragment detected...</p>
  <img src="image3.jpg">
</div>

<div class="scene" id="final">
  <div class="title">HAPPY BIRTHDAY PRIYA</div>
  <p>THE SYSTEM HAS ENDED THE TRANSMISSION</p>
</div>

<script>

let scenes=["s1","s2","s3","s4","s5","final"];
let i=0;

function nextScene(){
  document.getElementById(scenes[i]).classList.remove("active");
  i++;

  if(i<scenes.length){
    document.getElementById(scenes[i]).classList.add("active");
  }else{
    clearInterval(loop);
    document.getElementById("music").play();
  }

  flash();
}

function flash(){
  let f=document.getElementById("flash");
  f.style.opacity="0.3";
  setTimeout(()=>f.style.opacity="0",100);
}

let loop=setInterval(nextScene,4000);

</script>

</body>
</html>
