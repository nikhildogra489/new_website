<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Birthday Surprise 🎉</title>

<style>
body {
    margin: 0;
    font-family: Arial;
    background: linear-gradient(135deg,#ff4d6d,#6d28d9);
    height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    color: white;
    flex-direction: column;
}

.box {
    width: 160px;
    height: 160px;
    background: gold;
    display: flex;
    justify-content: center;
    align-items: center;
    font-size: 50px;
    border-radius: 15px;
    cursor: pointer;
}

.card {
    display: none;
    margin-top: 20px;
    text-align: center;
}

img {
    width: 300px;
    height: 200px;
    object-fit: cover;
    border-radius: 10px;
    margin-top: 10px;
}
</style>
</head>

<body>

<div class="box" onclick="openGift()">🎁</div>

<div class="card" id="card">
    <h1>🎉 Happy Birthday PRIYA 🎉</h1>
    <p>Click image to change</p>

    <img id="img" src="image1.jpg" onclick="changeImage()">
</div>

<audio id="song" loop>
    <source src="birthday.mp3">
</audio>

<script>

let step = 1;

function openGift() {
    console.log("Gift opened!");

    document.getElementById("card").style.display = "block";

    let song = document.getElementById("song");
    song.play().catch(err => {
        console.log("Audio blocked until user interaction");
    });
}

function changeImage() {
    let img = document.getElementById("img");

    if(step === 1){
        img.src = "image2.jpg";
        step = 2;
    }
    else if(step === 2){
        img.src = "image3.jpg";
        step = 3;
    }
    else {
        img.src = "image1.jpg";
        step = 1;
    }
}

</script>

</body>
</html>
