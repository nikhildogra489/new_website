<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Birthday Surprise 🎉</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;500;700&display=swap" rel="stylesheet">

<style>
body {
    margin: 0;
    font-family: 'Poppins', sans-serif;
    background: #0f172a;
    color: white;
    overflow-x: hidden;
}

/* HERO SECTION */
.hero {
    height: 100vh;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    text-align: center;
    background: linear-gradient(120deg, #ff4d6d, #6d28d9);
}

.hero h1 {
    font-size: 55px;
    margin: 0;
}

.hero p {
    font-size: 18px;
    opacity: 0.8;
}

button {
    margin-top: 20px;
    padding: 15px 35px;
    border: none;
    border-radius: 50px;
    font-size: 18px;
    cursor: pointer;
    background: white;
    color: #6d28d9;
    transition: 0.3s;
}

button:hover {
    transform: scale(1.1);
}

/* MAIN CARD */
.section {
    display: none;
    padding: 60px 20px;
    text-align: center;
}

.card {
    background: rgba(255,255,255,0.08);
    backdrop-filter: blur(10px);
    border: 1px solid rgba(255,255,255,0.2);
    width: 70%;
    margin: auto;
    padding: 40px;
    border-radius: 20px;
    box-shadow: 0 10px 30px rgba(0,0,0,0.4);
    animation: fadeIn 1s ease;
}

@keyframes fadeIn {
    from {opacity: 0; transform: scale(0.9);}
    to {opacity: 1; transform: scale(1);}
}

h2 {
    font-size: 36px;
    color: #ffcc00;
}

/* IMAGE SLIDER */
img {
    width: 100%;
    max-height: 450px;
    object-fit: cover;
    border-radius: 15px;
    cursor: pointer;
    transition: 0.5s;
}

img:hover {
    transform: scale(1.02);
}

/* FLOATING ANIMATION */
.floating {
    position: absolute;
    width: 15px;
    height: 15px;
    background: #ff4d6d;
    border-radius: 50%;
    animation: floatUp 6s linear infinite;
    opacity: 0.6;
}

@keyframes floatUp {
    from {transform: translateY(100vh);}
    to {transform: translateY(-200px);}
}

/* FOOTER */
footer {
    text-align: center;
    padding: 30px;
    opacity: 0.6;
}
</style>
</head>

<body>

<!-- HERO -->
<div class="hero">
    <h1>🎁 Birthday Surprise for PRIYA</h1>
    <p>A special experience is waiting for you</p>
    <button onclick="start()">Enter Surprise ✨</button>
</div>

<!-- MAIN -->
<div class="section" id="main">

    <div class="card">

        <h2>🎉 Happy Birthday PRIYA 🎉</h2>

        <p>Wishing you success, happiness & endless joy 💖</p>

        <img id="img" src="image1.jpg" onclick="changeImage()">

        <p>Click image to explore memories 👉</p>

    </div>

</div>

<!-- MUSIC -->
<audio id="song" loop>
    <source src="birthday.mp3">
</audio>

<footer>
Made with ❤️ for PRIYA
</footer>

<script>
let step = 1;

function start() {
    document.querySelector(".hero").style.display = "none";
    document.getElementById("main").style.display = "block";

    document.getElementById("song").play().catch(()=>{});

    createFloating();
}

/* IMAGE SLIDER */
function changeImage() {
    let img = document.getElementById("img");

    if(step === 1){
        img.src = "image2.jpg";
        step = 2;
    } else if(step === 2){
        img.src = "image3.jpg";
        step = 3;
    } else {
        img.src = "image1.jpg";
        step = 1;
    }
}

/* FLOATING BALLS */
function createFloating(){
    for(let i=0;i<20;i++){
        let f = document.createElement("div");
        f.className = "floating";
        f.style.left = Math.random()*100 + "vw";
        f.style.animationDuration = (Math.random()*5+3) + "s";
        document.body.appendChild(f);
    }
}
</script>

</body>
</html>
