<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Birthday Experience 🎉</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;500;700&display=swap" rel="stylesheet">

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    font-family: 'Poppins', sans-serif;
    background: black;
    overflow: hidden;
    color: white;
}

/* ===== CINEMATIC BACKGROUND ===== */
#bgVideo {
    position: fixed;
    right: 0;
    bottom: 0;
    min-width: 100%;
    min-height: 100%;
    z-index: -2;
    filter: brightness(0.4);
}

/* DARK OVERLAY */
.overlay {
    position: fixed;
    width: 100%;
    height: 100%;
    background: radial-gradient(circle, transparent, rgba(0,0,0,0.9));
    z-index: -1;
}

/* ===== INTRO SCREEN ===== */
#intro {
    height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    flex-direction: column;
    text-align: center;
}

.title {
    font-size: 60px;
    font-weight: 700;
    text-shadow: 0 0 30px #ff4d6d;
    animation: glow 2s infinite alternate;
}

@keyframes glow {
    from {text-shadow: 0 0 10px #ff4d6d;}
    to {text-shadow: 0 0 40px #ffcc00;}
}

.subtitle {
    margin-top: 10px;
    opacity: 0.7;
}

.btn {
    margin-top: 30px;
    padding: 15px 40px;
    border: none;
    border-radius: 50px;
    background: linear-gradient(45deg,#ff4d6d,#6d28d9);
    color: white;
    font-size: 18px;
    cursor: pointer;
    transition: 0.3s;
    box-shadow: 0 0 20px #ff4d6d;
}

.btn:hover {
    transform: scale(1.1);
}

/* ===== MAIN CONTENT ===== */
#main {
    display: none;
    height: 100vh;
    justify-content: center;
    align-items: center;
    text-align: center;
}

.card {
    width: 75%;
    padding: 40px;
    background: rgba(255,255,255,0.08);
    backdrop-filter: blur(20px);
    border-radius: 25px;
    border: 1px solid rgba(255,255,255,0.2);
    animation: pop 1s ease;
}

@keyframes pop {
    from {transform: scale(0.5); opacity: 0;}
    to {transform: scale(1); opacity: 1;}
}

h1 {
    font-size: 45px;
    color: #ffcc00;
    text-shadow: 0 0 10px #ff4d6d;
}

/* IMAGE */
img {
    width: 100%;
    max-height: 420px;
    object-fit: cover;
    border-radius: 20px;
    margin-top: 20px;
    cursor: pointer;
    transition: 0.5s;
}

img:hover {
    transform: scale(1.02);
}

/* FIREWORKS CANVAS */
canvas {
    position: fixed;
    top: 0;
    left: 0;
    z-index: 1;
}
</style>
</head>

<body>

<!-- CINEMATIC VIDEO BACKGROUND -->
<video autoplay muted loop id="bgVideo">
    <source src="background.mp4" type="video/mp4">
</video>

<div class="overlay"></div>

<!-- FIREWORKS -->
<canvas id="fire"></canvas>

<!-- INTRO -->
<div id="intro">
    <div class="title">🎁 BIRTHDAY EXPERIENCE</div>
    <div class="subtitle">Enter a world of surprise for PRIYA</div>
    <button class="btn" onclick="start()">ENTER ✨</button>
</div>

<!-- MAIN -->
<div id="main">
    <div class="card">

        <h1>🎉 Happy Birthday PRIYA 🎉</h1>
        <p>Wishing you love, success & endless happiness 💖</p>

        <img id="img" src="image1.jpg" onclick="nextImage()">

        <p>Tap image to explore memories ✨</p>

    </div>
</div>

<!-- MUSIC -->
<audio id="song" loop>
    <source src="birthday.mp3">
</audio>

<script>

let step = 1;

/* START EXPERIENCE */
function start() {
    document.getElementById("intro").style.display = "none";
    document.getElementById("main").style.display = "flex";

    document.getElementById("song").play().catch(()=>{});

    startFireworks();
}

/* IMAGE SWITCH */
function nextImage() {
    let img = document.getElementById("img");

    if(step === 1){
        img.src = "image2.jpg";
        step = 2;
    } else if(step === 2){
        img.src = "image3.jpg";
        step = 3;
    } else {
        img.src = "image1.jpg";
        step = 1;
    }
}

/* ===== FIREWORKS ENGINE ===== */
const canvas = document.getElementById("fire");
const ctx = canvas.getContext("2d");

canvas.width = window.innerWidth;
canvas.height = window.innerHeight;

let particles = [];

function createFirework(){
    for(let i=0;i<40;i++){
        particles.push({
            x: window.innerWidth/2,
            y: window.innerHeight/2,
            vx: (Math.random()-0.5)*8,
            vy: (Math.random()-0.5)*8,
            life: 100
        });
    }
}

function animate(){
    ctx.fillStyle = "rgba(0,0,0,0.2)";
    ctx.fillRect(0,0,canvas.width,canvas.height);

    particles.forEach((p,i)=>{
        p.x += p.vx;
        p.y += p.vy;
        p.life--;

        ctx.fillStyle = "hsl(" + p.life*3 + ",100%,50%)";
        ctx.fillRect(p.x,p.y,3,3);

        if(p.life <= 0){
            particles.splice(i,1);
        }
    });

    requestAnimationFrame(animate);
}

function startFireworks(){
    setInterval(createFirework, 800);
    animate();
}
</script>

</body>
</html>
