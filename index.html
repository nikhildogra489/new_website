<!DOCTYPE html>
<html>
<head>
    <title>Birthday Surprise for PRIYA 🎉</title>

    <style>
        body {
            margin: 0;
            font-family: Arial;
            background: linear-gradient(135deg, #0f172a, #1e293b);
            color: white;
            text-align: center;
        }

        .container {
            margin-top: 120px;
        }

        h1 {
            color: #38bdf8;
        }

        button {
            padding: 15px 25px;
            font-size: 18px;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            background: #22c55e;
            color: white;
            margin-top: 20px;
        }

        .poster {
            display: none;
            margin-top: 50px;
            animation: fadeIn 2s ease-in;
        }

        .birthday-text {
            font-size: 40px;
            color: #facc15;
            margin-top: 20px;
        }

        .emoji {
            font-size: 50px;
        }

        @keyframes fadeIn {
            from {opacity: 0;}
            to {opacity: 1;}
        }
    </style>
</head>

<body>

<div class="container">

    <h1>🎁 A Special Surprise Awaits</h1>
    <p>Click below to reveal it 🎉</p>

    <button onclick="showPoster()">Click Here</button>

    <!-- 🎂 Poster Section -->
    <div class="poster" id="poster">

        <div class="emoji">🎈🎂🎈</div>

        <div class="birthday-text">
            🎉 Happy Birthday PRIYA 🎉
        </div>

        <p style="font-size:20px;">
            Wishing you a day full of love, happiness and success 💖
        </p>

        <div class="emoji">🎂🎈🎊</div>

    </div>

</div>

<!-- 🎵 Birthday Music -->
<audio id="song" loop>
    <source src="birthday.mp3" type="audio/mpeg">
</audio>

<script>
function showPoster() {
    document.getElementById("poster").style.display = "block";
    document.getElementById("song").play();
}
</script>

</body>
</html>
